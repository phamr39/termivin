# Mobile app (mobile/): analyze + test on every change; release APKs on a tag.
#
#   push / PR touching mobile/        → flutter analyze + flutter test
#   tag mobile-v1.2.3                 → per-ABI release APKs attached to a GitHub Release
#   Actions → Mobile → Run workflow   → APKs as a downloadable artifact
#
# iOS builds need a macOS runner and your signing identity — see mobile/README.md.

name: Mobile

on:
  push:
    branches: [master]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
    tags: ['mobile-v*']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.35.3
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  apk:
    needs: test
    if: startsWith(github.ref, 'refs/tags/mobile-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.35.3
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - name: Name the APKs
        run: |
          V="${GITHUB_REF_NAME#mobile-v}"
          [ "$GITHUB_REF_TYPE" = tag ] || V="$(echo "$GITHUB_SHA" | cut -c1-7)"
          mkdir -p ../dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../dist/termivin-mobile-$V-$abi.apk"
          done
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: termivin-mobile-apks
          path: dist/*.apk
          retention-days: 30
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.apk
          generate_release_notes: true
