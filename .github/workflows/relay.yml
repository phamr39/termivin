# Relay (server/): test → multi-arch Docker image on GitHub Container Registry
# → optional deploy to your server over SSH.
#
#   push to master (server/ changed)  → ghcr.io/<owner>/termivin-relay:sha-xxxxxxx + :latest
#   tag relay-v1.2.3                  → … + :1.2.3 + :1.2
#   pull request                      → build only (no push)
#   Actions → Relay → Run workflow    → build, push, and deploy if you tick it
#
# Deploy needs an environment named "relay" (Settings → Environments; add
# required reviewers to make every deploy a click) with these secrets:
#   DEPLOY_HOST       user@server
#   DEPLOY_PATH       folder on the server holding the relay's .env
#   SSH_PRIVATE_KEY   a key allowed on DEPLOY_HOST
#   SSH_KNOWN_HOSTS   output of `ssh-keyscan <server>`
# optional:
#   DEPLOY_PROFILE    "tls" to run Caddy (HTTPS) too
#   GHCR_READ_TOKEN   PAT with read:packages, if the image package is private

name: Relay

on:
  push:
    branches: [master]
    paths: ['server/**', '.github/workflows/relay.yml']
    tags: ['relay-v*']
  pull_request:
    paths: ['server/**', '.github/workflows/relay.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the server after building
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/termivin-relay

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=match,pattern=relay-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=relay-v(\d+\.\d+),group=1
          labels: |
            org.opencontainers.image.title=termivin-relay
            org.opencontainers.image.description=Self-hosted relay between Termivin desktops and the Termivin phone app
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: relay
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: server
      - name: SSH setup
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else echo "StrictHostKeyChecking accept-new" >> ~/.ssh/config; fi
          echo "IdentityFile ~/.ssh/id_deploy" >> ~/.ssh/config
      - name: Copy compose files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/deploy'"
          scp server/docker-compose.yml "$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"
          scp server/deploy/Caddyfile "$DEPLOY_HOST:$DEPLOY_PATH/deploy/Caddyfile"
      - name: Pull and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PROFILE: ${{ secrets.DEPLOY_PROFILE }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          RELAY_IMAGE="${{ env.IMAGE }}:sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          PROFILE=${DEPLOY_PROFILE:+--profile $DEPLOY_PROFILE}
          ssh "$DEPLOY_HOST" sh -s <<EOF
          set -e
          cd '$DEPLOY_PATH'
          if [ -n '$GHCR_READ_TOKEN' ]; then echo '$GHCR_READ_TOKEN' | docker login ghcr.io -u '${{ github.repository_owner }}' --password-stdin; fi
          # pin the image in the server's .env, so a later plain 'docker compose up -d' keeps it
          touch .env
          if grep -q '^RELAY_IMAGE=' .env; then sed -i "s|^RELAY_IMAGE=.*|RELAY_IMAGE=$RELAY_IMAGE|" .env; else echo 'RELAY_IMAGE=$RELAY_IMAGE' >> .env; fi
          docker compose $PROFILE pull
          docker compose $PROFILE up -d --no-build
          sleep 5
          docker compose ps
          docker compose exec -T relay node -e "fetch('http://127.0.0.1:8787/healthz').then(r=>r.json()).then(j=>{console.log(j);process.exit(j.ok?0:1)})"
          EOF
