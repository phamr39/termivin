name: termivin
# termivin-relay
#
# Local / LAN (no TLS — phones and PCs on the same network or a VPN):
#   docker compose up -d
#   → http://<server-ip>:8787
#
# Public domain with automatic HTTPS (Let's Encrypt via Caddy):
#   set RELAY_DOMAIN + RELAY_PUBLIC_URL in .env, then
#   docker compose --profile tls up -d
#   → https://<RELAY_DOMAIN>

services:
  relay:
    build: .
    image: termivin-relay:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      RELAY_DATA_DIR: /data
      RELAY_PORT: "8787"
    ports:
      - "${RELAY_HTTP_PORT:-8787}:8787"
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on: [relay]
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
