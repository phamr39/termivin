# GitLab CI/CD for Termivin
#
#   test      desktop headless suites, relay, desktop⇄relay⇄phone integration, mobile
#   build     relay Docker image → GitLab Container Registry; Android APKs
#   deploy    (manual) relay onto your server over SSH
#
# Runner requirements:
#   - Docker executor for every job.
#   - build:relay-image uses Docker-in-Docker: the runner needs `privileged = true`
#     (or set RELAY_BUILDER=kaniko to build without privileges — see below).
#
# CI/CD variables (Settings → CI/CD → Variables), only for deploy:relay:
#   DEPLOY_HOST          user@server   (SSH target)
#   DEPLOY_PATH          /opt/termivin-relay   (folder with the relay's .env)
#   SSH_PRIVATE_KEY      private key allowed on DEPLOY_HOST (type: File or Variable, masked)
#   SSH_KNOWN_HOSTS      output of `ssh-keyscan <server>` (recommended)
#   DEPLOY_PROFILE       optional: "tls" to also run Caddy (HTTPS)

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - build
  - deploy

variables:
  NODE_IMAGE: node:22-bookworm
  FLUTTER_IMAGE: ghcr.io/cirruslabs/flutter:3.35.3
  RELAY_IMAGE: $CI_REGISTRY_IMAGE/relay
  RELAY_BUILDER: dind # dind | kaniko
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  npm_config_cache: $CI_PROJECT_DIR/.npm
  PUB_CACHE: $CI_PROJECT_DIR/.pub-cache

.npm-cache: &npm-cache
  key:
    files: [package-lock.json, server/package-lock.json]
  paths: [.npm/]

# ---------------------------------------------------------------- test

test:desktop:
  stage: test
  image: $NODE_IMAGE
  cache: *npm-cache
  script:
    - npm ci --no-audit --no-fund
    - (cd server && npm ci --no-audit --no-fund)
    # syntax/packaging, approval detection, session hub, turn summaries,
    # media, agent bus + CLI
    - npm test
    # desktop remote controller ⇄ real relay ⇄ fake phone
    - npm run test:remote

test:relay:
  stage: test
  image: $NODE_IMAGE
  cache: *npm-cache
  script:
    - cd server
    - npm ci --no-audit --no-fund
    - npm test
    - npm audit --omit=dev --audit-level=high

test:mobile:
  stage: test
  image: $FLUTTER_IMAGE
  cache:
    key:
      files: [mobile/pubspec.lock]
    paths: [.pub-cache/]
  script:
    - cd mobile
    - flutter pub get
    - flutter analyze
    - flutter test

# ---------------------------------------------------------------- build

.relay-image-rules:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [server/**/*]
      when: manual
      allow_failure: true

build:relay-image:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  rules:
    - if: $RELAY_BUILDER != "dind"
      when: never
    - !reference [.relay-image-rules, rules]
  needs: [test:relay]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker pull "$RELAY_IMAGE:latest" || true
    - >
      docker build --pull --cache-from "$RELAY_IMAGE:latest"
      --label org.opencontainers.image.revision=$CI_COMMIT_SHA
      --label org.opencontainers.image.source=$CI_PROJECT_URL
      -t "$RELAY_IMAGE:$CI_COMMIT_SHORT_SHA" server
    - docker push "$RELAY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$RELAY_IMAGE:$CI_COMMIT_SHORT_SHA" "$RELAY_IMAGE:$CI_COMMIT_TAG"
        docker push "$RELAY_IMAGE:$CI_COMMIT_TAG"
      fi
      if [ -n "$CI_COMMIT_TAG" ] || [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$RELAY_IMAGE:$CI_COMMIT_SHORT_SHA" "$RELAY_IMAGE:latest"
        docker push "$RELAY_IMAGE:latest"
      fi

# Same image without a privileged runner.
build:relay-image-kaniko:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: $RELAY_BUILDER != "kaniko"
      when: never
    - !reference [.relay-image-rules, rules]
  needs: [test:relay]
  script:
    - mkdir -p /kaniko/.docker
    - >
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}"
      > /kaniko/.docker/config.json
    - |
      DESTS="--destination $RELAY_IMAGE:$CI_COMMIT_SHORT_SHA"
      [ -n "$CI_COMMIT_TAG" ] && DESTS="$DESTS --destination $RELAY_IMAGE:$CI_COMMIT_TAG"
      if [ -n "$CI_COMMIT_TAG" ] || [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then DESTS="$DESTS --destination $RELAY_IMAGE:latest"; fi
      /kaniko/executor --context "$CI_PROJECT_DIR/server" --dockerfile "$CI_PROJECT_DIR/server/Dockerfile" $DESTS \
        --label org.opencontainers.image.revision=$CI_COMMIT_SHA --cache=true

build:android:
  stage: build
  image: $FLUTTER_IMAGE
  needs: [test:mobile]
  cache:
    key:
      files: [mobile/pubspec.lock]
    paths: [.pub-cache/]
    policy: pull
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - cd mobile
    - flutter pub get
    - flutter build apk --release --split-per-abi
    - mkdir -p ../dist
    - |
      for abi in arm64-v8a armeabi-v7a x86_64; do
        cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../dist/termivin-mobile-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}-$abi.apk"
      done
  artifacts:
    name: termivin-mobile-$CI_COMMIT_REF_SLUG
    paths: [dist/*.apk]
    expire_in: 30 days

# iOS needs a macOS runner with Xcode and your signing identity:
#   tags: [macos]; flutter build ipa --export-options-plist=ios/ExportOptions.plist

# ---------------------------------------------------------------- deploy

deploy:relay:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: build:relay-image
      optional: true
    - job: build:relay-image-kaniko
      optional: true
  rules:
    - if: $DEPLOY_HOST == null || $DEPLOY_HOST == ""
      when: never
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  environment:
    name: relay
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - |
      if [ -f "$SSH_PRIVATE_KEY" ]; then ssh-add "$SSH_PRIVATE_KEY"; else echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -; fi
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -n "$SSH_KNOWN_HOSTS" ]; then echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      else echo "StrictHostKeyChecking accept-new" > ~/.ssh/config; fi
  script:
    - TAG=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - ssh "$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/deploy'"
    # compose file + Caddyfile only; the server keeps its own .env and data volume
    - scp server/docker-compose.yml "$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"
    - scp server/deploy/Caddyfile "$DEPLOY_HOST:$DEPLOY_PATH/deploy/Caddyfile"
    - |
      ssh "$DEPLOY_HOST" sh -s <<EOF
      set -e
      cd '$DEPLOY_PATH'
      echo '$CI_DEPLOY_PASSWORD' | docker login -u '$CI_DEPLOY_USER' --password-stdin '$CI_REGISTRY' 2>/dev/null \
        || echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'
      touch .env
      if grep -q '^RELAY_IMAGE=' .env; then sed -i "s|^RELAY_IMAGE=.*|RELAY_IMAGE=$RELAY_IMAGE:$TAG|" .env; else echo 'RELAY_IMAGE=$RELAY_IMAGE:$TAG' >> .env; fi
      docker compose ${DEPLOY_PROFILE:+--profile $DEPLOY_PROFILE} pull
      docker compose ${DEPLOY_PROFILE:+--profile $DEPLOY_PROFILE} up -d --no-build
      sleep 5
      docker compose ps
      docker compose exec -T relay node -e "fetch('http://127.0.0.1:8787/healthz').then(r=>r.json()).then(j=>{console.log(j);process.exit(j.ok?0:1)})"
      EOF
